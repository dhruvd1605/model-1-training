<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marksheet Table</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        padding:20px;
    }

    .marksheet{
        width: 95%;
        margin:auto;
        border:2px solid black;
        border-collapse: collapse;
        background:white;
    }

    .marksheet td,
    .marksheet th{
        border:1px solid black;
        padding:8px;
        text-align:center;
    }

    .title{
        font-size:28px;
        font-weight:bold;
        padding:15px;
    }

    .left{
        text-align:left;
    }

    .footer{
        font-size:35px;
        font-weight:bold;
        padding:25px;
    }

    .summary{
        font-weight:bold;
    }
</style>
</head>

<body>

<table class="marksheet">

    <!-- Title -->
    <tr>
        <td colspan="8" class="title">
            Silver Oak University
        </td>
    </tr>

    <!-- Student Info -->
    <tr>
        <td colspan="4" class="left">
            <b>Name:</b> ___________________
        </td>

        <td colspan="4" class="left">
            <b>Seat No:</b> ___________________
        </td>
    </tr>

    <!-- Heading -->
    <tr>
        <th>Course Code</th>
        <th>Course Name</th>
        <th>CIE (TH)</th>
        <th>ESE (TH)</th>
        <th>ESE (PR1)</th>
        <th>ESE (PR2)</th>
        <th>Total Marks</th>
        <th>Obtained Marks</th>
    </tr>

    <!-- Rows -->
    <tr>
        <td>1</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>2</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>3</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <tr>
        <td>4</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>

    <!-- Summary -->
    <tr>
        <td colspan="6" class="summary">
            Total Marks
        </td>

        <td colspan="2"></td>
    </tr>

    <tr>
        <td colspan="4" class="summary">
            Percentage
        </td>

        <td colspan="4" class="summary">
            CGPA
        </td>
    </tr>

    <!-- Footer -->
    <tr>
        <td colspan="8" class="footer">
            All The Best
        </td>
    </tr>

</table>

</body>
</html>
